<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../Fichier_css/parametre.css">
	<title>Mon profil</title>
</head>
<body>
	<main class="profil">
		<a class="profil__retour" href="conversation.html">&#8592; Retour aux conversations</a>

		<section class="profil__carte">
			<div class="profil__banniere">
				<img id="banniere-image" alt="" hidden>
				<label class="profil__bouton-banniere">
					Changer la bannière
					<input id="banniere-input" type="file" accept="image/*" hidden>
				</label>
			</div>

			<div class="profil__haut">
				<label class="profil__avatar-label" aria-label="Changer la photo de profil">
					<span id="avatar" class="profil__avatar">?</span>
					<span class="profil__avatar-modifier">Modifier</span>
					<input id="photo-input" type="file" accept="image/*" hidden>
				</label>

				<div class="profil__identite">
					<h1 id="pseudo">Chargement...</h1>
					<p id="email"></p>
				</div>
			</div>

			<form id="bio-form" class="profil__bio">
				<label for="bio">Bio</label>
				<textarea id="bio" name="bio" rows="4" maxlength="300" placeholder="Parle un peu de toi..."></textarea>

				<div class="profil__bio-bas">
					<span id="bio-compteur" class="profil__compteur">0 / 300</span>
					<button type="submit">Enregistrer</button>
				</div>

				<p id="statut" class="profil__statut" aria-live="polite"></p>
			</form>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../Fichier_js/supabase-config.js"></script>
	<script src="../Fichier_js/parametre.js" defer></script>
</body>
</html>
