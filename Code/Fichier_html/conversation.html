<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../Fichier_css/conversation.css">
	<title>Conversation</title>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<header class="sidebar__header">
				<div id="mon-avatar" class="conversation__avatar" aria-hidden="true">?</div>
				<h2 id="mon-pseudo">Chargement...</h2>
				<a class="sidebar__parametres" href="parametre.html" aria-label="Mon profil">&#9881;</a>
			</header>

			<ul id="liste-conversations" class="sidebar__liste"></ul>
		</aside>

		<main id="conversation" class="conversation" data-conversation-id="">
			<header class="conversation__header">
				<button id="contact-bouton" class="conversation__contact" type="button" title="Voir le profil" disabled>
					<span id="contact-avatar" class="conversation__avatar" aria-hidden="true">?</span>
					<span id="contact-name" class="conversation__nom">Choisissez une conversation</span>
				</button>
			</header>

			<section id="messages" class="conversation__messages" aria-live="polite" aria-label="Messages">
			</section>

			<form id="message-form" class="conversation__composer">
				<input id="message-input" name="message" type="text" placeholder="Écrire un message..." autocomplete="off">
				<button id="send-message" type="submit" aria-label="Envoyer le message">&#10148;</button>
			</form>
		</main>
	</div>

	<dialog id="profil-dialog" class="profil-modal" aria-labelledby="profil-pseudo">
		<div class="profil-modal__banniere">
			<img id="profil-banniere" alt="" hidden>
		</div>
		<button id="profil-fermer" class="profil-modal__fermer" type="button" aria-label="Fermer">&times;</button>

		<div class="profil-modal__haut">
			<span id="profil-avatar" class="profil-modal__avatar" aria-hidden="true">?</span>
			<h2 id="profil-pseudo"></h2>
		</div>

		<p id="profil-bio" class="profil-modal__bio"></p>
	</dialog>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../Fichier_js/supabase-config.js"></script>
	<script src="../Fichier_js/conversation.js" defer></script>
</body>
</html>
