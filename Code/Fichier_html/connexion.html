<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Fichier_css/connexion.css">
    <title>Document</title>
</head>
<body class="connexion-page">
<div id="boite">
        <form action="accueil.html" method="post">
                <h2 style="text-decoration-line: underline;">Connexion à la messagerie</h2>
                <label>Adresse mail :</label>
                <input type="text" name="email" placeholder="Entrez votre adresse mail"><br>

                <label>Mot de passe :</label>
                <input type="password" name="password" placeholder="Entrez votre mot de passe"><br>

                <div class="remember-option">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Se souvenir de moi</label>
                </div>

                <a class="forgot-password" href="mot-de-passe-oublie.html">Mot de passe oublié ?</a>
  
                <button type="submit">Se connecter</button>
            </form>

</div>

    
    <script src="../Fichier_js/index.js" defer></script>
</body>
</html>
